services:
    mongo:
        image: mongo:7
        restart: unless-stopped
        volumes:
            - mongo_data:/data/db

    backend:
        build: ./backend
        restart: unless-stopped
        ports:
            - '3000:3000'
        env_file:
            - ./backend/.env
        environment:
            MONGO_DB_URL: mongodb://mongo:27017/template-mern
        volumes:
            - ./backend:/app
            - /app/node_modules
        depends_on:
            - mongo

    frontend:
        build: ./frontend
        restart: unless-stopped
        ports:
            - '5173:5173'
        volumes:
            - ./frontend:/app
            - /app/node_modules
        depends_on:
            - backend

volumes:
    mongo_data:
