services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  mongo_compass:
    image: mongodb/mongodb-community-server:8.0-ubi8
    environment:
      - CONN_STR=mongodb://mongo:27017/
    command: '/bin/bash -c "sleep 5; mongosh $$CONN_STR --eval \"show dbs;\""'
    depends_on:
      - mongo
  back:
    build: ./back
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./back/.env
    environment:
      MONGO_URL: mongodb://mongo:27017/template-mern
    volumes:
      - ./back:/app
      - /app/node_modules
    depends_on:
      - mongo

  front:
    build: ./front
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./front:/app
      - /app/node_modules
    depends_on:
      - back

volumes:
  mongo_data: